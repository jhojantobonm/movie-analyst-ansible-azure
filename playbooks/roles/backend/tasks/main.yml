---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - git
      - unzip
      - curl
      - stress-ng
    state: present
    update_cache: true

- name: Remove old Node.js
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: absent
    purge: true
  ignore_errors: true

- name: Autoremove unused packages
  ansible.builtin.apt:
    autoremove: true

- name: Add NodeSource repository
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js 20
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Azure CLI
  ansible.builtin.shell: |
    curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  args:
    creates: /usr/bin/az

- name: Login using Managed Identity
  ansible.builtin.command:
    cmd: az login --identity

- name: Verify Azure login
  ansible.builtin.command:
    cmd: az account show

- name: Clone backend repository
  ansible.builtin.git:
    repo: https://github.com/jhojantobonm/movie-analyst-api-azure.git
    dest: /home/ubuntu/movie-analyst-api-azure
    version: main
    update: true

- name: Set repository ownership
  ansible.builtin.file:
    path: /home/ubuntu/movie-analyst-api-azure
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Install npm dependencies
  community.general.npm:
    path: /home/ubuntu/movie-analyst-api-azure

- name: Deploy systemd service
  ansible.builtin.template:
    src: movie-backend.service.j2
    dest: /etc/systemd/system/movie-backend.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart backend