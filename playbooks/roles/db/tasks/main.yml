---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
      - unzip
      - curl
    state: present
    update_cache: true

- name: Install Azure CLI
  ansible.builtin.shell: |
    curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  args:
    creates: /usr/bin/az

- name: Login using Managed Identity
  ansible.builtin.command:
    cmd: az login --identity

- name: Verify Azure login
  ansible.builtin.command:
    cmd: az account show
  register: azure_account

- name: Read database secret from Azure Key Vault
  ansible.builtin.command:
    cmd: >
      az keyvault secret show
      --vault-name {{ key_vault_name }}
      --name {{ db_secret_name }}
      --query value
      -o tsv
  register: secret_json

- name: Parse Key Vault secret
  ansible.builtin.set_fact:
    db_credentials: "{{ secret_json.stdout | from_json }}"

- name: Set database variables
  ansible.builtin.set_fact:
    db_name: "{{ db_credentials.db_name }}"
    db_username: "{{ db_credentials.db_username }}"
    db_password: "{{ db_credentials.db_password }}"

- name: Debug database values
  ansible.builtin.debug:
    msg:
      - "db_name={{ db_name }}"
      - "db_username={{ db_username }}"
      - "db_password={{ db_password }}"

- name: Enable mysql
  ansible.builtin.service:
    name: mysql
    enabled: true
    state: started

- name: Allow remote connections
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: Restart mysql

- name: Create database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create application user
  community.mysql.mysql_user:
    name: "{{ db_username }}"
    password: "{{ db_password }}"
    host: "%"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Flush privileges
  community.mysql.mysql_query:
    query: FLUSH PRIVILEGES;
    login_unix_socket: /var/run/mysqld/mysqld.sock